[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fect"
version = "0.1.0"
description = "Fixed Effects Counterfactuals (FEct) for Python: causal inference with interactive fixed effects and event-study plots"
readme = "README.md"
authors = [{ name = "FEct Python Port" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
  "scipy>=1.9",
  "pandas>=1.4",
  "matplotlib>=3.5",
  "seaborn>=0.12",
  "scikit-learn>=1.1",
  "linearmodels>=5.1"
]
keywords = ["causal inference", "panel data", "difference-in-differences", "interactive fixed effects", "event study", "matrix completion"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis"
]

[project.urls]
Homepage = "https://github.com/your-org/fect-py"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["fect*"]
exclude = ["tests*"]
